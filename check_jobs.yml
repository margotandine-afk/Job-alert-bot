name: Check analyst job postings

on:
  schedule:
    # Runs every 2 hours. Adjust cron as needed (this is UTC time).
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run job check
        env:
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_EMAIL_APP_PASSWORD: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
        run: python check_jobs.py

      - name: Commit updated state
        run: |
          git config --global user.name "job-alert-bot"
          git config --global user.email "actions@github.com"
          git add state/
          git diff --quiet --cached || git commit -m "Update job snapshot state"
          git push
